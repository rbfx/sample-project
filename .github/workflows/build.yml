name: Build

on:
  push:
    branches-ignore:
      - 'no-ci-**'
      - 'skip-ci-**'
  pull_request:
  workflow_dispatch:

env:
  # Select `sdk` or `source` with the RBFX_FRAMEWORK_BUILD_TYPE repository variable.
  RBFX_FRAMEWORK_BUILD_TYPE: ${{ vars.RBFX_FRAMEWORK_BUILD_TYPE || 'sdk' }}
  RBFX_REPOSITORY: ${{ vars.RBFX_REPOSITORY || 'rokups/rbfx-temp' }}
  RBFX_REF: ${{ vars.RBFX_REF || 'rk/ci-reusable-workflow3' }}
  RBFX_RELEASE: ${{ vars.RBFX_RELEASE || 'latest' }}

jobs:
  PrepareMatrix:
    name: Prepare Matrix
    runs-on: ubuntu-latest
    outputs:
      platform_matrix: ${{ steps.prepare.outputs.platform_matrix }}
    steps:
      - name: Prepare rbfx matrix
        id: prepare
        uses: rokups/rbfx-temp/.github/actions/ci-prepare-matrix@rk/ci-reusable-workflow3
        with:
          artifact_platforms: 'windows,linux,macos,web'

  Build:
    name: ${{ matrix.ci_platform_tag }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    needs: [PrepareMatrix]
    runs-on: ${{ matrix.runs_on }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.PrepareMatrix.outputs.platform_matrix) }}

    steps:
      - name: Checkout sample project
        uses: actions/checkout@v5
        with:
          path: source-code
          fetch-depth: 1
          submodules: recursive

      - name: Checkout rbfx engine source
        if: env.RBFX_FRAMEWORK_BUILD_TYPE == 'source'
        uses: actions/checkout@v5
        with:
          repository: ${{ env.RBFX_REPOSITORY }}
          ref: ${{ env.RBFX_REF }}
          path: framework/rbfx
          fetch-depth: 1
          submodules: recursive

      - name: Download rbfx SDK
        if: env.RBFX_FRAMEWORK_BUILD_TYPE == 'sdk'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SDK_ASSET: rebelfork-sdk-${{ matrix.ci_platform_tag }}-latest.7z
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/framework"
          gh release download "$RBFX_RELEASE" \
            --repo "$RBFX_REPOSITORY" \
            --pattern "$SDK_ASSET" \
            --dir "${GITHUB_WORKSPACE}/framework"

      - name: Prepare rbfx environment
        id: rbfx
        uses: rokups/rbfx-temp/.github/actions/ci-prepare-platform@rk/ci-reusable-workflow3
        with:
          profile: downstream
          project_dir: source-code
          framework_build_type: ${{ env.RBFX_FRAMEWORK_BUILD_TYPE }}
          framework_source: framework/rbfx
          framework_sdk: framework/rebelfork-sdk-${{ matrix.ci_platform_tag }}-latest.7z
          host_artifact_names: |
            sample-project-build-${{ matrix.ci_host_platform_tag }}

      - name: Build sample project
        uses: rokups/rbfx-temp/.github/actions/ci-build-project@rk/ci-reusable-workflow3
        with:
          project_dir: source-code
          android_dir: android
          artifact_name: sample-project-build-${{ matrix.ci_platform_tag }}
