name: Build

on:
  push:
    branches-ignore:
      - 'no-ci-**'
      - 'skip-ci-**'
  pull_request:
  workflow_dispatch:

jobs:
  CheckSkipCI:
    runs-on: ubuntu-latest
    if: |
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.pull_request.title, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[skip-ci]') &&
      !contains(github.event.pull_request.title, '[skip-ci]')
    steps:
      - run: exit 0

  Build:
    if: github.event.pull_request.draft == false
    needs: [CheckSkipCI]
    uses: rokups/rbfx-temp/.github/workflows/project-ci.yml@rk/ci-reusable-workflow
    secrets: inherit
    with:
      rbfx_source_repository: rokups/rbfx-temp
      rbfx_source_ref: rk/ci-reusable-workflow
      android_gradle_dir: android
      deploy_artifacts: 'windows-msvc-x64-lib,web-emscripten-wasm-lib'
      artifact_name_prefix: sample-project-build